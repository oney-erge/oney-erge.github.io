version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the native port) is outside typescript-eslint's
      # supported range, so it crashes `npm run lint`. Revisit when
      # typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed context.getFilename(), which eslint-plugin-react
      # (bundled by eslint-config-next) still calls, so lint crashes.
      # Revisit when eslint-config-next supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
